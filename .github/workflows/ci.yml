name: CI - Database and Code Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test Database Connection and Code Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nepali_biz_business
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup environment variables
        run: |
          cp .env.example .env
          echo 'DATABASE_URL="postgresql://postgres:postgres@localhost:5434/nepali_biz_business?schema=public"' >> .env

      - name: Generate Prisma Client
        run: yarn prisma:generate

      - name: Run database migrations
        run: yarn prisma:migrate:deploy

      - name: Test database connection
        run: yarn test:db

      - name: Run linter
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Build application
        run: yarn nest:build

      - name: Summary
        if: success()
        run: |
          echo "✅ All checks passed!"
          echo "- Database connection: OK"
          echo "- Linting: OK"
          echo "- Tests: OK"
          echo "- Build: OK"
