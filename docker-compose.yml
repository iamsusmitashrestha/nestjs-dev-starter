version: '3.8'

services:
  api:
    container_name: nepali-biz-business-api
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@nepali-biz-business-db:5434/nepali_biz_business?schema=public
    depends_on:
      nepali-biz-business-db:
        condition: service_healthy
    networks:
      - nepali-biz-business-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  nepali-biz-business-db:
    image: postgres:16-alpine
    container_name: nepali-biz-business-db
    ports:
      - '5434:5432' # host port unique
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nepali_biz_business
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - nepali-biz-business-db-data:/var/lib/postgresql/data
    networks:
      - nepali-biz-business-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  nepali-biz-business-network:
    driver: bridge

volumes:
  nepali-biz-business-db-data:
